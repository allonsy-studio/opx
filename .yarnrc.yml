# Don't run install scripts from third-party packages. Workspace scripts (such
# as `prepare`) still run. If a dependency genuinely needs a build step, opt it
# in with `dependenciesMeta.<name>.built: true` in package.json.
enableScripts: false

nodeLinker: node-modules

# Refuse to resolve a package version newer than this. A buffer between a
# malicious or broken release and our installs; already-locked versions are
# unaffected.
npmMinimalAgeGate: 3d

# Our own packages are exempt so a new opx release can be adopted immediately.
npmPreapprovedPackages:
  - "@allons-y/*"

yarnPath: .yarn/releases/yarn-4.18.1.cjs
