name: Testing

on:
    push:
        branches: [main]
    pull_request:
        types: [opened, synchronize, reopened]
    merge_group:

jobs:
    test:
        permissions:
            # `permissions` is a full override, not a merge — without an explicit
            # `contents: read`, checkout fails on a private repo ("not found").
            contents: read
            pull-requests: write
        name: CI (node${{ matrix.node }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: [26, 24]
        steps:
            - name: Check out code
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: yarn

            - name: Install dependencies
              run: yarn install --immutable

            - name: Run build
              run: yarn ci

            - name: Test the code outside the workspaces
              # On Node 26, `yarn coverage` runs them with coverage instead.
              if: matrix.node != 26
              run: yarn test:root

            - name: Test
              if: matrix.node != 26
              run: yarn test

            - name: Run test suite with coverage
              if: matrix.node == 26
              run: yarn coverage

            - name: Coverage report
              id: coverage
              # Also after a coverage failure, so the comment shows which package missed.
              if: ${{ !cancelled() && matrix.node == 26 }}
              # One row per package and a `.` row for the code outside them, checked against the minimums in configs/jest.config.js.
              run: |
                  node scripts/coverage-report.js > code-coverage-results.md
                  cat code-coverage-results.md
                  shopt -s nullglob
                  files=(opx/*/coverage/coverage-summary.json)
                  if (( ${#files[@]} > 0 )); then echo "found=true"; else echo "found=false"; fi >> "$GITHUB_OUTPUT"

            - name: Upload coverage data
              if: ${{ !cancelled() && steps.coverage.outputs.found == 'true' }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: coverage-data-${{ github.run_id }}
                  path: opx/*/coverage/coverage-final.json

            - name: Add coverage PR comment
              # Fork PRs get a read-only token, so the comment can't be posted;
              # the job summary below still carries the report.
              if: >-
                  !cancelled() &&
                  steps.coverage.outputs.found == 'true' &&
                  github.event_name == 'pull_request' &&
                  github.event.pull_request.head.repo.full_name == github.repository
              uses: marocchino/sticky-pull-request-comment@78a72662e4e5d4233fa5f28f436806292cc66b65 # v2.6.0
              with:
                  recreate: true
                  path: code-coverage-results.md

            - name: Write to job summary
              if: ${{ !cancelled() && steps.coverage.outputs.found == 'true' }}
              run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

    # The same build and tests on the other platforms and TypeScript versions the
    # packages claim to support. `test` above stays the one that enforces coverage
    # and posts the report, since coverage differs a little between platforms.
    compat:
        name: test (${{ matrix.name }})
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include:
                    # lint-ts and release allow TypeScript ^5 || ^6; the repo itself uses 6.
                    - name: TypeScript 5
                      os: ubuntu-latest
                      typescript: "5"
                    - name: macOS
                      os: macos-latest
                    - name: Windows
                      os: windows-latest
        runs-on: ${{ matrix.os }}
        steps:
            - name: Check out code
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version-file: .nvmrc
                  cache: yarn

            - name: Install dependencies
              run: yarn install --immutable

            # Changes the lockfile in this job's checkout only; nothing is committed.
            - name: Use TypeScript ${{ matrix.typescript }}
              if: matrix.typescript
              run: yarn add --dev typescript@^${{ matrix.typescript }}

            - name: Run build
              run: yarn ci

            - name: Run test suite
              run: yarn test
