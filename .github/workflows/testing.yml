name: Testing

on:
    push:
        branches: [main]
    pull_request:
        types: [opened, synchronize, reopened]

jobs:
    test:
        permissions:
            # `permissions` is a full override, not a merge — without an explicit
            # `contents: read`, checkout fails on a private repo ("not found").
            contents: read
            pull-requests: write
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version-file: .nvmrc
                  cache: yarn

            - name: Install dependencies
              run: yarn install --immutable

            - name: Run build
              run: yarn ci

            - name: Run test suite with coverage
              run: yarn coverage

            - name: Aggregate coverage reports
              id: coverage
              run: |
                  shopt -s globstar nullglob
                  files=(opx/*/coverage/cobertura-coverage.xml)
                  if (( ${#files[@]} == 0 )); then
                      echo "found=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  mkdir -p coverage
                  cp "${files[0]}" coverage/cobertura-coverage.xml
                  for f in opx/*/coverage/coverage-final.json; do
                      [[ -e "$f" ]] && cp "$f" "coverage/$(basename "$(dirname "$(dirname "$f")")")-coverage.json"
                  done
                  echo "found=true" >> "$GITHUB_OUTPUT"

            - name: Upload coverage data
              if: steps.coverage.outputs.found == 'true'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: coverage-data-${{ github.run_id }}
                  path: |
                      coverage/coverage*.json

            - name: Coverage summary
              if: steps.coverage.outputs.found == 'true'
              uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
              with:
                  filename: coverage/cobertura-coverage.xml
                  format: "markdown"
                  output: "both"

            - name: Add coverage PR comment
              # Fork PRs get a read-only token, so the comment can't be posted;
              # the job summary below still carries the report.
              if: >-
                  steps.coverage.outputs.found == 'true' &&
                  github.event_name == 'pull_request' &&
                  github.event.pull_request.head.repo.full_name == github.repository
              uses: marocchino/sticky-pull-request-comment@78a72662e4e5d4233fa5f28f436806292cc66b65 # v2.6.0
              with:
                  recreate: true
                  path: code-coverage-results.md

            - name: Write to job summary
              if: steps.coverage.outputs.found == 'true'
              run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY
