name: Release

on:
    push:
        branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            id-token: write
        steps:
            # Pull requests opened with the default token come from github-actions[bot],
            # which starts no workflows, and its runs need approval. A GitHub App
            # installed on this repository is trusted, so its pull requests run CI
            # unattended. Without the app configured this step is skipped and the
            # default token is used as before.
            - name: Create the release bot token
              id: app-token
              if: ${{ vars.RELEASE_APP_CLIENT_ID != '' }}
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write

            - name: Check out code
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  token: ${{ steps.app-token.outputs.token || github.token }}

            - name: Setup Node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version-file: .nvmrc
                  cache: yarn

            - name: Install dependencies
              run: yarn install --immutable

            - name: Build
              run: yarn build

            - name: Create release pull request or publish
              uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
              with:
                  version: yarn version-packages
                  publish: yarn release
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
