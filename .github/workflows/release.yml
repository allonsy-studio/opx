name: Release

on:
    push:
        branches: [main]
    # Finish a release that a later push left unpublished.
    workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            id-token: write
        steps:
            - name: Create GitHub App token
              id: app-token
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
              with:
                  client-id: ${{ secrets.APP_CLIENT_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write

            - name: Check out code
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  token: ${{ steps.app-token.outputs.token }}

            - name: Setup Node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version-file: .nvmrc
                  cache: yarn

            - name: Install dependencies
              run: yarn install --immutable

            - name: Build
              run: yarn build

            - name: Create release pull request or publish
              uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
              with:
                  version: yarn run version
                  # Publish only from the version commit (or a manual run), so a push right
                  # after a release can't race npm while it's still processing that version.
                  publish: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(release): version packages')) && 'yarn release' || '' }}
                  # Conventional Commits, like every other pull request.
                  title: "chore(release): version packages"
                  commit: "chore(release): version packages"
                  commitMode: github-api
                  # opx release publish creates the GitHub releases.
                  createGithubReleases: false
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
