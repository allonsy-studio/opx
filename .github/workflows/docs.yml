name: Docs

on:
    push:
        branches: [main]
    pull_request:
        # open/reopen/update builds and publishes a preview; close tears it down.
        types: [opened, reopened, synchronize, closed]
    workflow_dispatch:

concurrency:
    group: gh-pages-deploy
    cancel-in-progress: false

permissions:
    contents: write # push to the gh-pages branch
    pull-requests: write # pr-preview-action comments the preview URL

env:
    SITE_BASE: "/opx/"

jobs:
    production:
        name: Deploy to gh-pages
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 1
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version-file: .nvmrc
                  cache: yarn

            - name: Install dependencies
              run: yarn install --immutable

            - name: Build docs site
              env:
                  DOCS_BASE_URL: ${{ env.SITE_BASE }}
              run: |
                  yarn docs:build
                  touch opx/docs/_site/.nojekyll

            - name: Deploy to gh-pages
              uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
              with:
                  branch: gh-pages
                  folder: opx/docs/_site
                  # Wipe stale files, but keep active PR previews and the
                  # custom-domain CNAME (a no-op when neither is present).
                  clean: true
                  clean-exclude: |
                      preview/
                      CNAME

    # Preview: publish each PR under /preview/N/
    preview:
        name: Deploy PR preview
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 1
                  persist-credentials: false

            # A closed PR only needs teardown, so skip the build entirely.
            - name: Setup Node
              if: github.event.action != 'closed'
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version-file: .nvmrc
                  cache: yarn

            - name: Install dependencies
              if: github.event.action != 'closed'
              run: yarn install --immutable

            - name: Build preview site
              if: github.event.action != 'closed'
              env:
                  DOCS_BASE_URL: ${{ format('{0}preview/{1}/', env.SITE_BASE, github.event.number) }}
              run: yarn docs:build

            # Fork PRs get a read-only token, so they build (to catch breakage)
            # but can't be published.
            - name: Deploy preview to gh-pages
              if: github.event.pull_request.head.repo.full_name == github.repository
              uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1
              with:
                  source-dir: opx/docs/_site
                  preview-branch: gh-pages
                  umbrella-dir: preview
