name: ✨ Feature request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Filling this out completely helps maintainers gauge whether it fits opx's scope. If you want a new tool supported, say whether it belongs in a first-party plugin or in a community plugin.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case. What can't you do with opx today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like this to work? A command, a config key, or a sketch of the output all help.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you've tried or other approaches you considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, related issues, anything else.
