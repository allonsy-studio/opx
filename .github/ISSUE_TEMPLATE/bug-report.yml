name: 🐛 Bug report
description: Report a problem with opx
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. The more concrete the repro, the faster the fix.

  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package is the problem in?
      options:
        - "@allons-y/opx-cli"
        - "@allons-y/opx (engine)"
        - "@allons-y/opx-lint-js"
        - "@allons-y/opx-lint-json"
        - "@allons-y/opx-lint-md"
        - "@allons-y/opx-release"
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `opx --version` (e.g. `0.2.0-beta.0`).
      placeholder: 0.2.0-beta.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node.js version, package manager, and operating system.
      placeholder: Node 24.1, yarn 4.18, macOS 15
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Your .opx/config.json
      description: Paste your config, if relevant.
      render: json

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The commands you ran, in order. A link to a minimal repository is ideal.
      placeholder: |
        1. opx init
        2. opx lint
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include error messages. Re-run with `--debug` for the full stack trace.
      render: text
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else worth knowing.
